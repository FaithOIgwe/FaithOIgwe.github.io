<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier: French to TCF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient teacher who is serious about the exam date
   IDEA: a French school cahier: Séyès-ruled paper, red margin, blue fountain-pen ink
   PICTURE: today's lesson page written on ruled paper beside an A1→C2 ladder and exam countdown
   COLOUR and TYPE: white paper, encre bleue, margin red; Fraunces titles, Atkinson Hyperlegible body, Caveat for the handwritten notes
   LAYOUT: ink header + scrolling tab row; every tab opens on the working tool, notes below */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fc,#0a0f27);--paper:light-dark(#ffffff,#111938);--ink:light-dark(#141e62,#e8ecff);
--mute:light-dark(#555e8e,#a8b1dc);--rule:light-dark(#dde4fa,#1e2a5a);--red:light-dark(#d32a44,#ff7a8c);
--blue:light-dark(#2340d8,#9caeff);--soft:light-dark(#e9eeff,#19234f);--ok:light-dark(#11744a,#62d9a2);
--warn:light-dark(#9a4f00,#ffc46b);--hd:light-dark(#141e62,#060a1d);--line:light-dark(#c9d2f2,#2a376c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(32px,5vw,46px)}h2{font-size:24px;margin-top:1.4em}h3{font-size:19px;font-weight:500}
p{margin:.3em 0 .8em;max-width:70ch}a{color:var(--blue)}
.band{padding:clamp(22px,3.5vw,48px) max(4vw,16px)}.wrap{max-width:1240px;margin:0 auto}
header{background:var(--hd);color:#fff;padding:14px max(4vw,16px) 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.brand b{font:700 26px Fraunces,serif}.acct{margin-left:auto;color:#fff;border:1.5px solid #ffffff66;border-radius:999px;padding:6px 14px;text-decoration:none;font-size:14px;min-height:36px;display:inline-flex;align-items:center}.acct[hidden]{display:none}.brand span{opacity:.75;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:10px auto 0;scrollbar-width:none}
.tabs a{flex:none;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;opacity:.78;min-height:44px;display:flex;align-items:center}
.tabs a.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.paper{position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);border-radius:14px;padding:22px 22px 22px 70px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px #0b145266}
.paper::before{content:"";position:absolute;left:48px;top:0;bottom:0;width:2px;background:var(--red);opacity:.75}
.card{background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 1px 0 var(--line),0 10px 26px -20px #0b145266}
.hand{font:600 26px/1.1 Caveat,cursive;color:var(--red);margin:0}
.mute{color:var(--mute)}.small{font-size:14px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--red)}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 15px;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--blue)}
.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sm{min-height:38px;padding:6px 12px;font-size:15px}
.say{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%;flex:none;color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{width:100%;min-height:220px;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
label{font-weight:700}
.tgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.session ol{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:76px minmax(0,1fr) 48px;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border-bottom:0}
.mins{font:600 34px/1 Caveat,cursive;color:var(--red);white-space:nowrap}
.mins small{font-size:18px}
.blk.done h3,.blk.done p{opacity:.5}.blk.done h3{text-decoration:line-through}
.tick{position:relative;width:44px;height:44px}.tick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tick span{position:absolute;inset:6px;border:2px solid var(--ink);border-radius:8px}
.tick input:checked+span{background:var(--ok);border-color:var(--ok)}
.tick input:checked+span::after{content:"";position:absolute;left:10px;top:3px;width:8px;height:16px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg)}
.tick input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.count{font:600 clamp(56px,9vw,84px)/.9 Caveat,cursive;color:var(--red)}
.ladder{display:grid;gap:8px;margin-top:14px}
.rung{display:grid;grid-template-columns:34px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.rung b{font-family:Fraunces,serif}.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.rung.tg b{color:var(--red)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.unit{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit;padding:16px}
.unit .n{font:600 30px/1 Caveat,cursive;color:var(--red)}.unit.dn .n{color:var(--ok)}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:4px 0}
.ex .fr{font-weight:700;font-size:18px}.ex .en{color:var(--mute);font-size:15px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vw{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:4px 12px 4px 4px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}.q:last-child{border-bottom:0}
.q input{width:min(260px,100%)}
.fb{font-weight:700;margin:.4em 0 0}
.big{font:700 clamp(24px,4vw,34px)/1.25 Fraunces,serif;margin:12px 0}
.snd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ipa{font:700 40px/1 Fraunces,serif;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700}
.opts{display:grid;gap:8px;margin:10px 0}.opts button{justify-content:flex-start;text-align:left}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--paper))}
.w-ok{color:var(--ok)}.w-acc{color:var(--warn);text-decoration:underline wavy}.w-miss{color:var(--red);text-decoration:line-through}
.flash{min-height:230px;display:grid;place-items:center;text-align:center;cursor:pointer}
.timer{font:600 48px/1 Caveat,cursive;color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:Fraunces,serif}td.num,th.num{text-align:right;white-space:nowrap}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:9}
.toast.on{opacity:1}
.credit{position:fixed;right:12px;bottom:12px;margin:0;background:var(--paper);color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;z-index:8;max-width:calc(100vw - 24px)}.credit a{color:var(--blue)}
.phase{min-height:1.6em;font:600 24px Caveat,cursive;color:var(--red)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.form label{display:grid;gap:6px}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:900px){.tgrid,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.paper{padding:18px 14px 18px 44px}.paper::before{left:30px}.blk{grid-template-columns:66px minmax(0,1fr) 44px;gap:8px}.mins{font-size:28px}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:700;white-space:normal}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.blk,.card,.unit{transition:opacity .25s}.flash{transition:transform .25s}.flash:active{transform:scale(.98)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header>
  <div class="brand"><b>Cahier</b><span>French from A1 to C2 for the TCF</span><a id="acct" href="#account" class="acct" hidden></a></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#today">Aujourd'hui</a><a href="#course">Parcours</a><a href="#sounds">Sons</a><a href="#shadow">Shadowing</a><a href="#listen">Écoute</a><a href="#read">Lecture</a><a href="#write">Écriture</a><a href="#speak">Oral</a><a href="#words">Mots</a><a href="#tcf">TCF</a><a href="#community">Communauté</a><a href="#plan">Plan</a>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<p class="credit" id="credit" hidden></p>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
