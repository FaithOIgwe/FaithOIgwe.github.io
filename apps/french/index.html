<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cahier: French to TCF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
/* VOICE: a patient teacher who is serious about the exam date
   IDEA: a French school cahier: Séyès-ruled paper, red margin, blue fountain-pen ink
   PICTURE: today's lesson page written on ruled paper beside an A1→C2 ladder and exam countdown
   COLOUR and TYPE: white paper, encre bleue, margin red; Fraunces titles, Atkinson Hyperlegible body, Caveat for the handwritten notes
   LAYOUT: ink header + scrolling tab row; every tab opens on the working tool, notes below */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fc,#0a0f27);--paper:light-dark(#ffffff,#111938);--ink:light-dark(#141e62,#e8ecff);
--mute:light-dark(#555e8e,#a8b1dc);--rule:light-dark(#dde4fa,#1e2a5a);--red:light-dark(#d32a44,#ff7a8c);
--blue:light-dark(#2340d8,#9caeff);--soft:light-dark(#e9eeff,#19234f);--ok:light-dark(#11744a,#62d9a2);
--warn:light-dark(#9a4f00,#ffc46b);--hd:light-dark(#141e62,#060a1d);--line:light-dark(#c9d2f2,#2a376c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(32px,5vw,46px)}h2{font-size:24px;margin-top:1.4em}h3{font-size:19px;font-weight:500}
p{margin:.3em 0 .8em;max-width:70ch}a{color:var(--blue)}
.band{padding:clamp(22px,3.5vw,48px) max(4vw,16px)}.wrap{max-width:1240px;margin:0 auto}
header{background:var(--hd);color:#fff;padding:14px max(4vw,16px) 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.brand b{font:700 26px Fraunces,serif}.brand span{opacity:.75;font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:10px auto 0;scrollbar-width:none}
.tabs a{flex:none;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;opacity:.78;min-height:44px;display:flex;align-items:center}
.tabs a.on{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.paper{position:relative;background-color:var(--paper);background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);border-radius:14px;padding:22px 22px 22px 70px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px #0b145266}
.paper::before{content:"";position:absolute;left:48px;top:0;bottom:0;width:2px;background:var(--red);opacity:.75}
.card{background:var(--paper);border-radius:14px;padding:20px;box-shadow:0 1px 0 var(--line),0 10px 26px -20px #0b145266}
.hand{font:600 26px/1.1 Caveat,cursive;color:var(--red);margin:0}
.mute{color:var(--mute)}.small{font-size:14px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--red)}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 15px;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--blue)}
.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sm{min-height:38px;padding:6px 12px;font-size:15px}
.say{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%;flex:none;color:var(--blue)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{width:100%;min-height:220px;line-height:32px;background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
label{font-weight:700}
.tgrid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.session ol{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:76px minmax(0,1fr) 48px;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border-bottom:0}
.mins{font:600 34px/1 Caveat,cursive;color:var(--red);white-space:nowrap}
.mins small{font-size:18px}
.blk.done h3,.blk.done p{opacity:.5}.blk.done h3{text-decoration:line-through}
.tick{position:relative;width:44px;height:44px}.tick input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.tick span{position:absolute;inset:6px;border:2px solid var(--ink);border-radius:8px}
.tick input:checked+span{background:var(--ok);border-color:var(--ok)}
.tick input:checked+span::after{content:"";position:absolute;left:10px;top:3px;width:8px;height:16px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg)}
.tick input:focus-visible+span{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.count{font:600 clamp(56px,9vw,84px)/.9 Caveat,cursive;color:var(--red)}
.ladder{display:grid;gap:8px;margin-top:14px}
.rung{display:grid;grid-template-columns:34px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.rung b{font-family:Fraunces,serif}.bar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.rung.tg b{color:var(--red)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.unit{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;text-decoration:none;color:inherit;padding:16px}
.unit .n{font:600 30px/1 Caveat,cursive;color:var(--red)}.unit.dn .n{color:var(--ok)}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:4px 0}
.ex .fr{font-weight:700;font-size:18px}.ex .en{color:var(--mute);font-size:15px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vw{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:12px;padding:4px 12px 4px 4px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}.q:last-child{border-bottom:0}
.q input{width:min(260px,100%)}
.fb{font-weight:700;margin:.4em 0 0}
.big{font:700 clamp(24px,4vw,34px)/1.25 Fraunces,serif;margin:12px 0}
.snd{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ipa{font:700 40px/1 Fraunces,serif;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700}
.opts{display:grid;gap:8px;margin:10px 0}.opts button{justify-content:flex-start;text-align:left}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--paper))}
.w-ok{color:var(--ok)}.w-acc{color:var(--warn);text-decoration:underline wavy}.w-miss{color:var(--red);text-decoration:line-through}
.flash{min-height:230px;display:grid;place-items:center;text-align:center;cursor:pointer}
.timer{font:600 48px/1 Caveat,cursive;color:var(--red)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:Fraunces,serif}td.num,th.num{text-align:right;white-space:nowrap}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:9}
.toast.on{opacity:1}
.phase{min-height:1.6em;font:600 24px Caveat,cursive;color:var(--red)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.form label{display:grid;gap:6px}
details{margin:10px 0}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:900px){.tgrid,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.paper{padding:18px 14px 18px 44px}.paper::before{left:30px}.blk{grid-template-columns:52px minmax(0,1fr) 44px;gap:8px}.mins{font-size:28px}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:700;white-space:normal}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.blk,.card,.unit{transition:opacity .25s}.flash{transition:transform .25s}.flash:active{transform:scale(.98)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<body>
<header>
  <div class="brand"><b>Cahier</b><span>French from A1 to C2 for the TCF</span></div>
  <nav class="tabs" aria-label="Sections">
    <a href="#today">Aujourd'hui</a><a href="#course">Parcours</a><a href="#sounds">Sons</a><a href="#shadow">Shadowing</a><a href="#listen">Écoute</a><a href="#read">Lecture</a><a href="#write">Écriture</a><a href="#speak">Oral</a><a href="#words">Mots</a><a href="#tcf">TCF</a><a href="#plan">Plan</a>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LV=['A1','A2','B1','B2','C1','C2'];
const END={A1:100,A2:200,B1:400,B2:600,C1:850,C2:1100};
const prevEnd=l=>{const i=LV.indexOf(l);return i?END[LV[i-1]]:0};
const LVINFO={
A1:['Découverte','100–199','Introduce yourself, ask and answer simple questions about familiar things, follow slow and clear speech.'],
A2:['Survie','200–299','Handle routine tasks and short exchanges, talk about your past and surroundings, read short practical texts.'],
B1:['Seuil','300–399','Cope with most everyday situations, tell a story, give opinions with reasons, write a connected text.'],
B2:['Avancé','400–499','Argue a point clearly, follow most radio, TV and articles, write a structured, detailed essay.'],
C1:['Autonome','500–599','Speak fluently and precisely, understand long demanding texts and what is implied, switch register at will.'],
C2:['Maîtrise','600–699','Understand virtually everything, summarise sources coherently, express fine shades of meaning spontaneously.']};

/* ---------- CURRICULUM: [level, title, explanation, examples[fr,en], vocab[fr,en], exercises[prompt, answer(s) | separated, hint]] ---------- */
const RAW=[
["A1","Saluer et se présenter","Use tu with friends, family and children; use vous with strangers, in formal situations, or for more than one person. To give your name say je m'appelle (literally 'I call myself'). French stresses the last syllable of each group of words, so keep the other syllables short and even.",
[["Bonjour, je m'appelle Faith.","Hello, my name is Faith."],["Comment vous appelez-vous ?","What is your name? (formal)"],["Enchantée ! Je suis nigériane.","Nice to meet you! I'm Nigerian. (a woman speaking)"],["Salut, ça va ? Ça va bien, merci.","Hi, how are you? Fine, thanks."]],
[["bonjour","hello, good morning"],["bonsoir","good evening"],["salut","hi (informal)"],["au revoir","goodbye"],["merci beaucoup","thank you very much"],["s'il vous plaît","please (formal)"]],
[["Comment tu ___ ? (s'appeler)","t'appelles","tu form of s'appeler"],["Je ___ appelle Marie.","m'","me becomes m' before a vowel"]]],
["A1","Être et avoir","These two irregular verbs carry the whole language. Être: je suis, tu es, il/elle/on est, nous sommes, vous êtes, ils/elles sont. Avoir: j'ai, tu as, il/elle/on a, nous avons, vous avez, ils/elles ont. French uses avoir for age (j'ai 26 ans). In speech, on is the everyday word for 'we'.",
[["Je suis analyste de données.","I am a data analyst."],["Nous avons un chat et un chien.","We have a cat and a dog."],["Elle a vingt-six ans.","She is twenty-six."],["Vous êtes d'où ? Je suis du Nigeria.","Where are you from? I'm from Nigeria."]],
[["un an","a year"],["un métier","a job, trade"],["un pays","a country"],["une ville","a city"],["la famille","the family"],["un ami, une amie","a friend"]],
[["Ils ___ fatigués. (être)","sont","ils form of être"],["J'___ faim. (avoir)","ai","j' + avoir"],["Tu ___ quel âge ? (avoir)","as",""]]],
["A1","Le genre et les articles","Every noun is masculine or feminine, so learn each noun with its article. Definite: le (m), la (f), l' (before a vowel or silent h), les (plural). Indefinite: un (m), une (f), des (plural). The plural -s is silent, so you hear the plural in the article: le livre sounds different from les livres.",
[["J'aime le café et la musique.","I like coffee and music."],["Il y a un livre sur la table.","There is a book on the table."],["Les enfants sont à l'école.","The children are at school."]],
[["le livre","the book"],["la table","the table"],["l'école","school (f)"],["la maison","the house"],["le téléphone","the phone"],["l'eau","water (f)"]],
[["J'ai ___ voiture rouge. (a)","une","voiture is feminine"],["___ hôtel est grand. (the)","l'","silent h takes l'"]]],
["A1","Les verbes en -er et la négation","Most verbs end in -er. Drop -er and add -e, -es, -e, -ons, -ez, -ent. Only the nous and vous forms sound different: je parle, tu parles and ils parlent all sound the same. To make a sentence negative, wrap the verb in ne … pas; ne becomes n' before a vowel. In casual speech the ne often disappears: je sais pas.",
[["Je parle anglais et un peu français.","I speak English and a little French."],["Nous travaillons le lundi.","We work on Mondays."],["Elle n'aime pas le froid.","She doesn't like the cold."]],
[["parler","to speak"],["travailler","to work"],["habiter","to live (somewhere)"],["aimer","to like, to love"],["manger","to eat"],["écouter","to listen"]],
[["Vous ___ à Lagos ? (habiter)","habitez",""],["Il n'___ pas le thé. (aimer)","aime",""],["Nous ___ la radio. (écouter)","écoutons",""]]],
["A1","Poser des questions","Three ways to ask, from casual to formal: rising intonation (Tu viens ?), est-ce que (Est-ce que tu viens ?) and inversion (Viens-tu ?). Question words: qui (who), quoi / que (what), où (where), quand (when), comment (how), pourquoi (why), combien (how much, how many), quel / quelle (which).",
[["Est-ce que tu aimes le sport ?","Do you like sport?"],["Où est la gare, s'il vous plaît ?","Where is the station, please?"],["Pourquoi tu apprends le français ? Parce que je veux travailler au Canada.","Why are you learning French? Because I want to work in Canada."]],
[["où","where"],["quand","when"],["pourquoi","why"],["parce que","because"],["combien","how much, how many"],["comment","how"]],
[["___ coûte ce sac ? (how much)","combien",""],["___ est-ce que tu habites ? (where)","où",""]]],
["A1","Les adjectifs","Adjectives agree with their noun: add -e for feminine and -s for plural (petit, petite, petits, petites). Most go after the noun (une voiture rouge), but short common ones go before: beau, bon, grand, petit, jeune, vieux, nouveau, joli, mauvais. Adding -e often makes a silent consonant heard: petit ends in a vowel sound, petite ends in t.",
[["C'est une ville très animée.","It's a very lively city."],["J'ai une petite sœur et un grand frère.","I have a little sister and a big brother."],["Les chaussures noires sont chères.","The black shoes are expensive."]],
[["grand, grande","big, tall"],["petit, petite","small"],["nouveau, nouvelle","new"],["cher, chère","expensive, dear"],["content, contente","happy"],["facile","easy"]],
[["Elle est très ___. (content)","contente",""],["Ce sont des robes ___. (vert)","vertes","feminine plural"]]],
["A1","Nombres, heure et dates","Learn 0 to 20 by heart. After 60, French counts in twenties: 70 is soixante-dix (60 + 10), 80 is quatre-vingts (4 × 20), 90 is quatre-vingt-dix. Time: il est huit heures et demie. Dates use le + number (le 3 mars) except the first: le premier mai. Il y a means there is or there are.",
[["Il est neuf heures et quart.","It's quarter past nine."],["Mon anniversaire, c'est le premier avril.","My birthday is the first of April."],["Ça coûte quatre-vingt-quinze euros.","It costs ninety-five euros."]],
[["aujourd'hui","today"],["demain","tomorrow"],["hier","yesterday"],["la semaine","the week"],["le mois","the month"],["midi","noon"]],
[["70 = ___","soixante-dix",""],["Il est 12 h : il est ___.","midi",""]]],
["A1","Aller, faire, venir et le futur proche","Aller: je vais, tu vas, il va, nous allons, vous allez, ils vont. Faire: je fais, nous faisons, vous faites, ils font. Venir: je viens, nous venons, ils viennent. The futur proche is aller + infinitive: je vais partir. With places: à + city (à Paris), en + feminine country (en France), au + masculine country (au Nigeria, au Canada), aux + plural (aux États-Unis).",
[["Ce week-end, je vais faire du sport.","This weekend I'm going to do some sport."],["Nous allons au Canada en juin.","We're going to Canada in June."],["Tu viens avec nous ce soir ?","Are you coming with us tonight?"]],
[["le week-end","the weekend"],["le voyage","the trip"],["partir","to leave"],["la gare","the train station"],["l'avion","the plane (m)"],["faire les courses","to do the shopping"]],
[["Elle ___ au Sénégal l'année prochaine. (aller)","va",""],["Nous habitons ___ Canada.","au","masculine country"]]],

["A2","Le passé composé avec avoir","For completed past actions: avoir in the present + past participle. -er verbs give -é (parlé), -ir verbs give -i (fini), and many common verbs are irregular: fait, pris, vu, eu, été, dit, écrit, lu, bu, mis. Negation goes around the auxiliary: je n'ai pas compris.",
[["Hier, j'ai regardé un film français.","Yesterday I watched a French film."],["Tu as fini ton travail ?","Have you finished your work?"],["Je n'ai pas compris la question.","I didn't understand the question."]],
[["hier soir","last night"],["la semaine dernière","last week"],["déjà","already"],["pas encore","not yet"],["comprendre","to understand"],["prendre","to take"]],
[["Nous ___ pris le bus. (avoir)","avons",""],["Elle a ___ une lettre. (écrire)","écrit",""]]],
["A2","Le passé composé avec être","About fifteen verbs of movement or change of state use être: aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, retourner, passer, devenir, plus revenir and rentrer. All reflexive verbs use être too. The participle agrees with the subject: elle est partie, ils sont arrivés.",
[["Elle est née à Enugu.","She was born in Enugu."],["Nous sommes rentrés très tard.","We came home very late."],["Je suis tombée dans l'escalier.","I fell on the stairs. (a woman speaking)"]],
[["naître","to be born"],["arriver","to arrive"],["rester","to stay"],["tomber","to fall"],["rentrer","to go home"],["sortir","to go out"]],
[["Mes amies sont ___ à 8 h. (partir)","parties","feminine plural agreement"],["Il ___ resté à la maison.","est","rester takes être"]]],
["A2","L'imparfait","Use it for description, background, habits and ongoing states in the past. Take the nous form of the present, drop -ons, and add -ais, -ais, -ait, -ions, -iez, -aient (nous parlons gives je parlais). The only irregular stem is être: j'étais. Clue words: avant, quand j'étais petit(e), tous les jours, souvent.",
[["Quand j'étais petite, j'habitais avec ma grand-mère.","When I was little I lived with my grandmother."],["Il faisait chaud et il y avait beaucoup de monde.","It was hot and there were lots of people."],["Avant, je prenais le bus tous les matins.","I used to take the bus every morning."]],
[["avant","before, in the past"],["souvent","often"],["d'habitude","usually"],["l'enfance","childhood (f)"],["tous les jours","every day"],["le quartier","the neighbourhood"]],
[["Nous ___ souvent à la plage. (aller)","allions",""],["Quand il était jeune, il ___ beaucoup. (lire)","lisait","nous lisons gives lis-"]]],
["A2","Les verbes pronominaux et la routine","Reflexive verbs carry a pronoun that matches the subject: je me lève, tu te lèves, il se lève, nous nous levons, vous vous levez, ils se lèvent. In the passé composé they take être: elle s'est réveillée. In the futur proche the pronoun stays next to the infinitive: je vais me coucher.",
[["Je me lève à six heures pour courir.","I get up at six to go running."],["On se retrouve devant le cinéma ?","Shall we meet in front of the cinema?"],["Elle s'est couchée tard hier.","She went to bed late yesterday."]],
[["se lever","to get up"],["se réveiller","to wake up"],["se coucher","to go to bed"],["s'habiller","to get dressed"],["se dépêcher","to hurry"],["se reposer","to rest"]],

["A2","Les pronoms COD et COI","Direct object (who or what): me, te, le, la, l', nous, vous, les. Indirect object (to whom, after verbs with à): me, te, lui, nous, vous, leur. The pronoun goes before the verb: je la vois, je lui parle. In the passé composé it goes before the auxiliary, and the participle agrees with a direct object placed before it: je l'ai vue.",

["A2","Les articles partitifs et les quantités","For an unspecified amount use du, de la, de l', des (some): je bois du café. After a negative they become de or d': je ne bois pas de café. After a quantity use de alone: beaucoup de sucre, un kilo de riz, une bouteille d'eau. After aimer, adorer and détester keep le, la, les: j'aime le riz.",
[["Je voudrais du pain et de la confiture.","I'd like some bread and jam."],["Il n'y a plus de lait.","There's no more milk."],["Achète un kilo de tomates, s'il te plaît.","Buy a kilo of tomatoes, please."]],
[["le pain","bread"],["le riz","rice"],["la viande","meat"],["les légumes","vegetables (m)"],["une bouteille","a bottle"],["un peu de","a little"]],
[["Je ne mange pas ___ viande.","de","negative gives de"],["Tu veux ___ eau ?","de l'","partitive before a vowel"]]],
["A2","Comparer","Plus, moins or aussi + adjective + que: le train est plus rapide que le bus. With nouns: plus de, moins de, autant de … que. Irregular forms: bon becomes meilleur, bien becomes mieux. Superlative: le, la, les plus + adjective: la ville la plus chère.",
[["Le train est plus rapide que le bus.","The train is faster than the bus."],["Elle parle mieux français que moi.","She speaks French better than me."],["C'est le meilleur restaurant du quartier.","It's the best restaurant in the neighbourhood."]],

["A2","Y, en et l'impératif","Y replaces a place or à + thing: Tu vas à Paris ? Oui, j'y vais. En replaces de + noun or goes with a quantity: Tu as des frères ? Oui, j'en ai deux. The imperative uses the tu, nous and vous forms without a subject: Écoute ! Allons-y ! Prenez la deuxième rue. -er verbs drop the -s in the tu form (parle), except before y or en (vas-y).",
[["Tu es déjà allée à Dakar ? Non, je n'y suis jamais allée.","Have you been to Dakar? No, I've never been there."],["Du café ? Oui, j'en veux bien.","Coffee? Yes, I'd love some."],["Tournez à gauche, puis continuez tout droit.","Turn left, then keep going straight."]],

["B1","Raconter : passé composé et imparfait","In a story the imparfait sets the scene (weather, feelings, what was going on) and the passé composé moves the plot forward (single events, interruptions): je dormais quand le téléphone a sonné. Signal words for events: soudain, tout à coup, un jour, ce jour-là.",
[["Il pleuvait quand je suis sortie du bureau.","It was raining when I left the office."],["Nous mangions tranquillement quand, tout à coup, la lumière s'est éteinte.","We were eating quietly when suddenly the lights went out."],["Ce jour-là, j'ai compris que je voulais changer de métier.","That day I understood I wanted to change careers."]],

["B1","Le futur simple et la condition probable","Futur simple = infinitive + -ai, -as, -a, -ons, -ez, -ont (je parlerai, je finirai; -re verbs drop the e: je prendrai). Irregular stems: ser- (être), aur- (avoir), ir- (aller), fer- (faire), pourr-, voudr-, devr-, viendr-, verr-, saur-. For a likely condition: si + présent, then futur: si tu viens, on ira au marché. After quand about the future French uses the futur too.",
[["L'année prochaine, je passerai le TCF.","Next year I'll take the TCF."],["Si j'ai le temps, je t'appellerai ce soir.","If I have time, I'll call you tonight."],["Quand tu seras à Montréal, tu verras la différence.","When you're in Montreal, you'll see the difference."]],

["B1","Le conditionnel présent","Same stem as the futur + imparfait endings: je voudrais, tu pourrais, il faudrait. Uses: politeness (Pourriez-vous m'aider ?), wishes (J'aimerais voyager), advice (Tu devrais dormir plus) and unlikely hypotheses with si + imparfait: si j'avais plus de temps, je lirais davantage.",
[["Je voudrais prendre rendez-vous, s'il vous plaît.","I'd like to make an appointment, please."],["À ta place, je parlerais à ton manager.","If I were you, I'd talk to your manager."],["Si nous habitions à Paris, nous irions au musée chaque semaine.","If we lived in Paris we'd go to the museum every week."]],

[["Tu ___ te reposer. (devoir)","devrais",""],["Si j'étais riche, j'___ une maison. (acheter)","achèterais","si + imparfait, then conditionnel"]]],
["B1","Les pronoms relatifs qui, que, où, dont","Qui is the subject (la femme qui parle). Que, qu' is the direct object (le livre que je lis). Où is for place or time (la ville où je suis née, le jour où …). Dont replaces de + noun: le film dont je parle (parler de), la personne dont le frère …",

["B1","Le subjonctif présent","Use it after necessity, will, emotion and doubt when the subject changes: il faut que, je veux que, je suis contente que, j'ai peur que. Form: take the ils form of the present, drop -ent, add -e, -es, -e, -ions, -iez, -ent (ils finissent gives que je finisse). Key irregulars: que je sois, que j'aie, que j'aille, que je fasse, que je puisse, que je sache, que je veuille.",
[["Il faut que tu sois à l'heure demain.","You must be on time tomorrow."],["Je veux que vous fassiez cet exercice.","I want you to do this exercise."],["Je suis ravie que tu puisses venir.","I'm delighted you can come."]],

["B1","Le plus-que-parfait et le discours rapporté","Plus-que-parfait = avoir or être in the imparfait + participle, for an action before another past action: quand je suis arrivée, le film avait commencé. In reported speech after a past verb, tenses shift back: présent to imparfait, passé composé to plus-que-parfait, futur to conditionnel. Il a dit : « Je viens » becomes il a dit qu'il venait.",
[["Elle m'a dit qu'elle avait perdu ses clés.","She told me she had lost her keys."],["Il a expliqué qu'il viendrait plus tard.","He explained he would come later."],["Nous étions fatigués parce que nous avions marché toute la journée.","We were tired because we had walked all day."]],

["B1","Donner son opinion et relier ses idées","The TCF rewards connectors. Opinion: à mon avis, selon moi, je pense que, il me semble que. Cause: parce que, car, puisque, grâce à (positive), à cause de (negative). Consequence: donc, c'est pourquoi, alors. Opposition: mais, cependant, par contre, alors que. Adding: de plus, en outre, d'ailleurs. Careful: je ne pense pas que takes the subjonctif.",
[["À mon avis, le télétravail présente plus d'avantages que d'inconvénients.","In my opinion remote work has more advantages than drawbacks."],["Je ne pense pas que ce soit une bonne idée.","I don't think it's a good idea."],["Il pleuvait, c'est pourquoi le match a été annulé.","It was raining, which is why the match was cancelled."]],

["B1","Le gérondif et le participe présent","Gérondif = en + nous stem + -ant (en parlant, en faisant). It shows two actions at once or the way something is done: j'apprends le français en écoutant des podcasts. Irregular: étant, ayant, sachant. Without en, the participe présent belongs to written style and often replaces qui: les candidats ayant réussi = qui ont réussi.",
[["Elle chante en cuisinant.","She sings while cooking."],["C'est en forgeant qu'on devient forgeron.","Practice makes perfect. (proverb)"],["En arrivant à la gare, j'ai vu mon ancien professeur.","On arriving at the station I saw my former teacher."]],

["B2","Le subjonctif après conjonctions et doute","Some conjunctions always take the subjonctif: bien que, quoique (although), pour que, afin que (so that), avant que, à moins que, sans que, jusqu'à ce que. So do doubt and possibility: je doute que, il est possible que, il se peut que. Après que takes the indicative in standard French. With the same subject, use an infinitive: pour réussir, avant de partir.",
[["Bien qu'il soit fatigué, il continue à travailler.","Although he's tired he keeps working."],["Je t'explique pour que tu comprennes.","I'm explaining so that you understand."],["Il se peut que la réunion soit reportée.","The meeting may be postponed."]],

["B2","Le conditionnel passé et l'irréel du passé","Conditionnel passé = avoir or être in the conditionnel + participle: j'aurais aimé, nous serions partis. Uses: regret (j'aurais dû étudier plus), unconfirmed news (le ministre aurait démissionné = reportedly resigned) and the unreal past: si + plus-que-parfait, conditionnel passé: si j'avais su, je serais venue.",
[["Si j'avais commencé plus tôt, j'aurais déjà le niveau B2.","If I'd started earlier I'd already be at B2."],["Tu aurais dû me prévenir.","You should have warned me."],["Selon la presse, l'incendie aurait fait trois blessés.","According to the press the fire reportedly injured three people."]],

["B2","La voix passive et les tournures impersonnelles","Passive = être in any tense + a participle that agrees with the subject; the agent comes with par: la loi a été votée par le Parlement. French often prefers on (on a construit un pont) or a pronominal verb (ce plat se mange froid). Impersonal phrases: il est nécessaire de, il reste, il s'agit de, il est question de.",
[["Le pont a été construit en 1930.","The bridge was built in 1930."],["Les résultats seront publiés la semaine prochaine.","Results will be published next week."],["Il s'agit d'un problème complexe.","It's a complex problem."]],

["B2","Les pronoms relatifs composés","After a preposition, use lequel, laquelle, lesquels, lesquelles for things (qui is fine for people): l'outil avec lequel je travaille. À + lequel gives auquel, auxquels, auxquelles; de + lequel gives duquel, used after compound prepositions: le parc près duquel j'habite. Ce qui, ce que, ce dont mean 'what' (the thing that).",

["B2","Nuancer l'opposition et la concession","Go beyond mais: pourtant, néanmoins, toutefois (however), en revanche (on the other hand), alors que, tandis que (whereas), malgré + noun (despite), même si + indicative, quand bien même + conditionnel (even if). An essay concession: Certes …, mais … or Il est vrai que …, néanmoins …",

["B2","Structurer un texte argumentatif (TCF tâche 3)","Writing task 3 gives two short documents with opposing views. Plan it: (1) one neutral sentence introducing the debate, (2) summarise view A and view B in your own words, about 40 words in all, (3) give your opinion with one argument and one example. Signposts: d'une part … d'autre part, selon le premier document, en revanche, le second …, pour ma part, en conclusion.",
[["Le premier document souligne les avantages du télétravail.","The first document highlights the benefits of remote work."],["Le second, en revanche, insiste sur l'isolement des salariés.","The second, by contrast, stresses employees' isolation."],["Pour ma part, je suis favorable à un modèle hybride.","For my part, I'm in favour of a hybrid model."]],

["B2","La nominalisation","Turning verbs and adjectives into nouns makes writing denser and more formal, as in headlines and B2 essays: augmenter gives l'augmentation, choisir gives le choix, développer gives le développement, réduire gives la réduction, lent gives la lenteur. Les prix augmentent becomes l'augmentation des prix.",

["C1","Les registres de langue","C1 means choosing a register on purpose. Familier: t'inquiète, c'est relou, bosser, une bagnole. Courant: ne t'inquiète pas, c'est pénible, travailler, une voiture. Soutenu: ne vous inquiétez point, c'est fâcheux, œuvrer, un véhicule. In TCF writing aim for courant to soutenu; in speaking task 2 match the situation you are given.",

["C1","La mise en relief","Emphasis structures: c'est … qui, c'est … que (c'est Paul qui a gagné); ce qui …, c'est … (ce qui m'étonne, c'est son calme); ce que …, c'est … (ce que je veux, c'est comprendre); and in speech, dislocation: le français, je l'adore. They make speaking task 3 sound natural and well argued.",

["C1","Modaliser : nuance et prudence","Advanced speakers hedge. Certainty: il est indéniable que, sans aucun doute. Probability: il est probable que + indicatif, il semblerait que + subjonctif, vraisemblablement, a priori. Distance: d'après certains, prétendument. Softening: dans une certaine mesure, plus ou moins, en quelque sorte.",

["C1","Participes et accords avancés","The compound participle (ayant fini, étant parti) shows that one action came first, in formal writing: ayant terminé son rapport, elle est partie. With avoir, the participle agrees with a direct object placed before it: les lettres que j'ai écrites. Pronominal verbs agree with their direct object: elle s'est lavée, but elle s'est lavé les mains (the object comes after).",

/* ---------- HELPERS ---------- */
const norm=s=>String(s).toLowerCase().replace(/[’`]/g,"'").replace(/…/g,' ').replace(/\s+/g,' ').replace(/[.!?;,]+$/,'').trim();
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const checkAns=(inp,ans)=>{const a=norm(inp),o=ans.split('|').map(norm);if(o.includes(a))return 2;if(o.map(strip).includes(strip(a)))return 1;return 0};
const words=s=>norm(s).replace(/[«»"!?.,;:()]/g,' ').split(/\s+/).filter(Boolean);
function wdiff(exp,got){const A=words(exp),B=words(got),n=A.length,m=B.length;const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=strip(A[i])===strip(B[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0;const out=[];let good=0;while(i<n){if(j<m&&strip(A[i])===strip(B[j])){const ok=A[i]===B[j];out.push([A[i],ok?'w-ok':'w-acc']);good+=ok?1:.5;i++;j++}else if(j<m&&L[i][j+1]>=L[i+1][j])j++;else{out.push([A[i],'w-miss']);i++}}
  return{html:out.map(([w,c])=>`<span class="${c}">${esc(w)}</span>`).join(' '),score:Math.round(100*good/Math.max(n,1))}}

   <label>I'm starting at<select name="start">${LV.map(l=>`<option ${l===p.start?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Target level<select name="target">${LV.slice(1).map(l=>`<option ${l===p.target?'selected':''}>${l}</option>`).join('')}</select></label>
   <label>Minutes a day <span id="minv" class="mute">${p.min} min</span><input type="range" name="min" min="15" max="240" step="5" value="${p.min}" style="padding:0"></label>
   <label>Study days a week<select name="dpw">${[3,4,5,6,7].map(n=>`<option ${n===p.dpw?'selected':''}>${n}</option>`).join('')}</select></label>
   <label>Class hours a week<input type="number" name="cls" min="0" max="40" step="0.5" value="${p.cls}" inputmode="decimal"></label>
   <p class="small mute" style="grid-column:1/-1">Not sure of your level? Take the 18-question test in the TCF tab. Units below your starting level count as known.</p></form>
  <div class="card" id="proj" aria-live="polite"></div></div>
  <h2>Keep your progress</h2><p class="small">Progress lives in this browser only. Copy your progress code to move it to another device or keep a backup.</p>
  <div class="row"><button id="bcopy">Copy progress code</button><button id="bload">Restore from code</button><button id="breset">Reset everything</button></div>
  <textarea id="bcode" style="min-height:90px;margin-top:10px;line-height:1.4;background-image:none" placeholder="Paste a progress code here to restore it" aria-label="Progress code"></textarea></div></section>`}

/* ---------- ROUTER ---------- */
const VIEWS={today:rToday,course:rCourse,sounds:rSounds,shadow:rShadow,listen:rListen,read:rRead,write:rWrite,speak:rSpeak,words:rWords,tcf:rTcf,plan:rPlan};
function route(){
  playId++;if(hasTTS)try{speechSynthesis.cancel()}catch(e){}stopTimers();INIT=null;
  const h=location.hash.slice(1)||'today',isL=h.startsWith('u-'),v=isL?'course':(VIEWS[h]?h:'today');
  if(v!=='words')Q=null;
  $$('.tabs a').forEach(a=>{const on=a.getAttribute('href')==='#'+v;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const m=$('#main'),scroll=route.last===h?window.scrollY:0;m.innerHTML=isL?rLesson(h.slice(2)):VIEWS[v]();route.last=h;
  if(INIT){const f=INIT;INIT=null;f()}window.scrollTo(0,scroll)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){playId++;say(b.dataset.say)}
  const r=e.target.closest('[data-rate]');if(r){S.rate=+r.dataset.rate;save();route()}});
window.addEventListener('hashchange',route);
route();
}
</script>
